# Async Web Scraper Configuration

# URLs to scrape
urls:
  - https://books.toscrape.com/
  - https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html
  - https://books.toscrape.com/catalogue/sharp-objects_997/index.html

# HTTP headers for requests
headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  Accept-Language: "en-US,en;q=0.9"
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8"

# Delay between requests (in seconds) to avoid overloading servers
delay: 1.0

# Request timeout (in seconds)
timeout: 30

# CSS selectors for data extraction
# Supports special suffixes:
#   - :text for text content (default)
#   - :html for inner HTML
#   - :attr:name for attribute value (e.g., image_src:attr:src)
#   - :all for multiple elements (returns list)
selectors:
  title: "h1"
  price: ".price_color"
  availability: ".instock.availability:text"
  description: "#product_description + p"
  category: ".breadcrumb li:nth-child(3) a"
  rating: ".product_main .star-rating::class"
  image_src: ".item.active img::attr(src)"
  paragraphs: "p:all"

# Whether to follow links found on pages (crawling mode)
follow_links: false

# CSS selectors for extracting links (used when follow_links is true)
link_selectors:
  - "article h3 a"
  - ".pager a"

# Maximum number of concurrent requests
max_concurrent: 5

# Output file path
output_file: "output/scraped_data.json"

# Output format: 'json' or 'csv'
output_format: "json"
